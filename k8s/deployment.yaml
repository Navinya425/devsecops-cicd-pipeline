apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  namespace: default
  labels:
    app: devsecops-app
    environment: dev
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devsecops-app
        environment: dev
    spec:
      # ============================================
      # SECURITY CONTEXT — runs as non-root user
      # ============================================
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

      containers:
        - name: devsecops-app
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/devsecops-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP

          # ============================================
          # RESOURCE LIMITS — prevents overconsumption
          # ============================================
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "256m"

          # ============================================
          # ENVIRONMENT VARIABLES
          # ============================================
          env:
            - name: APP_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5000"

          # ============================================
          # HEALTH CHECKS — restarts app if unhealthy
          # ============================================
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # ============================================
          # SECURITY — locks down the container
          # ============================================
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          # ============================================
          # WRITABLE TEMP DIRECTORY — needed since
          # root filesystem is read-only
          # ============================================
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: tmp-volume
          emptyDir: {}

      # ============================================
      # IMAGE PULL — authenticates with ECR
      # ============================================
      imagePullSecrets:
        - name: ecr-registry-secret

      restartPolicy: Always