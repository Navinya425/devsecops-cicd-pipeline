name: CD Deployment Pipeline

on:
  workflow_run:
    workflows: ["CI Security Pipeline"]
    types:
      - completed
    branches: ["main"]

env:
  AWS_REGION: ap-south-1
  APP_NAME: devsecops-app
  ECR_REPOSITORY: devsecops-app
  ECS_CLUSTER: devsecops-app-cluster
  ECS_SERVICE: devsecops-app-service

jobs:

# ============================================
# JOB 1 - CHECK CI PASSED
# ============================================
  check-ci:
    name: Check CI Pipeline Status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI Pipeline Passed
        run: |
          echo "✅ CI Pipeline passed successfully"
          echo "🚀 Starting CD Pipeline"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

# ============================================
# JOB 2 - TERRAFORM FIRST
# Creates ECR and all AWS infrastructure
# before we try to push any Docker image
# ============================================
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: check-ci
    outputs:
      ecr-registry: ${{ steps.get-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -out=tfplan \
            -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            tfplan
          echo "✅ Infrastructure created successfully"

      - name: Get ECR Registry URL
        id: get-ecr
        working-directory: terraform
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "ECR URL: $ECR_URL"
          REGISTRY=$(echo $ECR_URL | cut -d'/' -f1)
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "Registry: $REGISTRY"

# ============================================
# JOB 3 - BUILD AND PUSH DOCKER IMAGE
# Runs after Terraform so ECR exists
# ============================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: set-tag
        run: |
          TAG=${{ github.event.workflow_run.head_sha }}
          SHORT_TAG=${TAG::8}
          echo "tag=$SHORT_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $SHORT_TAG"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          echo "✅ Image pushed successfully"
          echo "📦 Image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}"

# ============================================
# JOB 4 - DEPLOY TO DEV
# ============================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to DEV ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ DEV deployment triggered"

      - name: Wait for DEV deployment
        run: |
          echo "⏳ Waiting for DEV deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ DEV deployment stable"

      - name: Smoke test DEV
        run: |
          echo "🧪 Running smoke tests on DEV..."
          EC2_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=devsecops-app-ecs-instance" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "DEV IP: $EC2_IP"
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            http://$EC2_IP:5000/health || echo "000")
          echo "Health check status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Smoke test passed - app is healthy"
          else
            echo "⚠️ Smoke test returned status $HTTP_STATUS - app may still be starting"
          fi

# ============================================
# JOB 5 - DEPLOY TO STAGING
# ============================================
  deploy-staging:
    name: Deploy to STAGING
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to STAGING ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ STAGING deployment triggered"

      - name: Wait for STAGING deployment
        run: |
          echo "⏳ Waiting for STAGING deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ STAGING deployment stable"

      - name: Smoke test STAGING
        run: |
          echo "🧪 Running smoke tests on STAGING..."
          EC2_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=devsecops-app-ecs-instance" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "STAGING IP: $EC2_IP"
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            http://$EC2_IP:5000/health || echo "000")
          echo "Health check status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Smoke test passed - app is healthy"
          else
            echo "⚠️ Smoke test returned status $HTTP_STATUS - app may still be starting"
          fi

# ============================================
# JOB 6 - MANUAL APPROVAL GATE
# ============================================
  approval-gate:
    name: Manual Approval for PROD
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Awaiting Manual Approval
        run: |
          echo "⏸️ Waiting for manual approval to deploy to PRODUCTION"
          echo "✅ DEV deployment passed"
          echo "✅ STAGING deployment passed"
          echo "👉 Approve this job in GitHub Actions to deploy to PROD"

# ============================================
# JOB 7 - DEPLOY TO PROD
# ============================================
  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: approval-gate

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to PROD ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ PROD deployment triggered"

      - name: Wait for PROD deployment
        run: |
          echo "⏳ Waiting for PROD deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ PROD deployment stable"

      - name: Fetch secrets from AWS Secrets Manager
        run: |
          echo "🔐 Fetching secrets from AWS Secrets Manager..."
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id devsecops-app-secrets \
            --query SecretString \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "✅ Secrets fetched successfully"
          echo "🚀 Application deployed to PRODUCTION"

      - name: Final PROD smoke test
        run: |
          echo "🧪 Running final smoke test on PROD..."
          EC2_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=devsecops-app-ecs-instance" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "PROD IP: $EC2_IP"
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            http://$EC2_IP:5000/health || echo "000")
          echo "Health check status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ PROD smoke test passed"
            echo "🎉 Deployment complete - app is live!"
          else
            echo "⚠️ PROD smoke test returned status $HTTP_STATUS"
            echo "Please check ECS logs in CloudWatch"
          fi

      - name: Deployment Summary
        run: |
          echo "================================================"
          echo "✅ DEPLOYMENT COMPLETE"
          echo "================================================"
          echo "App: ${{ env.APP_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Service: ${{ env.ECS_SERVICE }}"
          echo "================================================"