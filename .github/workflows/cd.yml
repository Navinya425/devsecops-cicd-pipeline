name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Security Pipeline"]
    types:
      - completed

jobs:

  docker-build-push:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

    # Checkout Repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/devsecops-app:${{ github.sha }} .

    # Push Docker Image
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-app:${{ github.sha }}

    # Success Message
    - name: CD Success
      run: |
        echo "Docker image built and pushed successfully"