name: CD Deployment Pipeline

on:
  workflow_run:
    workflows: ["CI Security Pipeline"]
    types:
      - completed
    branches: ["main"]

jobs:

# ============================================
# JOB 1 - CHECK CI PASSED
# ============================================
  check-ci:
    name: Check CI Pipeline Status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI Pipeline Passed
        run: |
          echo "✅ CI Pipeline passed"
          echo "🚀 Starting CD Pipeline"

# ============================================
# JOB 2 - START KIND CLUSTER
# ============================================
  setup-cluster:
    name: Setup Kubernetes Cluster
    runs-on: ubuntu-latest
    needs: check-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: |
          kind create cluster --name devsecops --wait 60s
          kubectl cluster-info --context kind-devsecops
          echo "✅ Kubernetes cluster ready"

      - name: Verify cluster
        run: |
          kubectl get nodes
          echo "✅ Cluster verified"

# ============================================
# JOB 3 - START VAULT & STORE SECRETS
# ============================================
  setup-vault:
    name: Setup Vault Secrets Manager
    runs-on: ubuntu-latest
    needs: setup-cluster
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Vault
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | \
            sudo gpg --dearmor -o \
            /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault -y
          vault version
          echo "✅ Vault installed"

      - name: Start Vault in dev mode
        run: |
          vault server -dev \
            -dev-root-token-id="root-token" \
            -dev-listen-address="0.0.0.0:8200" &
          echo "⏳ Waiting for Vault to be ready..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8200/v1/sys/health \
              > /dev/null 2>&1; then
              echo "✅ Vault ready after $i attempts"
              break
            fi
            echo "Attempt $i - waiting..."
            sleep 2
          done

      - name: Store secrets in Vault
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root-token
        run: |
          vault kv put secret/devsecops-app \
            app-env="production" \
            app-key="devsecops-super-secret-key-2024" \
            db-password="securedbpassword123"
          echo "✅ Secrets stored in Vault"

      - name: Verify secrets in Vault
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root-token
        run: |
          vault kv get secret/devsecops-app
          echo "✅ Secrets verified in Vault"

# ============================================
# JOB 4 - TERRAFORM APPLY
# ============================================
  terraform:
    name: Terraform - Create K8s Infrastructure
    runs-on: ubuntu-latest
    needs: setup-vault
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster --name devsecops --wait 60s
          mkdir -p $HOME/.kube
          kind get kubeconfig --name devsecops > $HOME/.kube/config
          echo "✅ Cluster ready for Terraform"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve
          echo "✅ Kubernetes namespaces created by Terraform"

      - name: Verify namespaces
        run: |
          kubectl get namespaces
          echo "✅ dev, staging, prod namespaces ready"

# ============================================
# JOB 5 - BUILD DOCKER IMAGE
# ============================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image
        run: |
          docker build -t devsecops-app:latest .
          echo "✅ Docker image built"

      - name: Save Docker image
        run: |
          docker save devsecops-app:latest > devsecops-app.tar
          echo "✅ Docker image saved"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: devsecops-app.tar
          retention-days: 1

# ============================================
# JOB 6 - DEPLOY TO DEV
# ============================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install kind and create cluster
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name devsecops --wait 60s
          mkdir -p $HOME/.kube
          kind get kubeconfig --name devsecops > $HOME/.kube/config

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into kind
        run: |
          docker load < devsecops-app.tar
          kind load docker-image devsecops-app:latest --name devsecops
          echo "✅ Image loaded into cluster"

      - name: Create dev namespace
        run: |
          kubectl create namespace dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes secret to DEV
        run: |
          kubectl apply -f k8s/secret.yaml -n dev
          echo "✅ Secrets applied to DEV"

      - name: Deploy to DEV
        run: |
          kubectl apply -f k8s/deployment.yaml -n dev
          kubectl apply -f k8s/service.yaml -n dev
          echo "✅ App deployed to DEV"

      - name: Wait for DEV deployment
        run: |
          kubectl rollout status deployment/devsecops-app \
            -n dev --timeout=120s
          echo "✅ DEV deployment stable"

      - name: Smoke test DEV
        run: |
          echo "🧪 Running DEV smoke test..."
          kubectl get pods -n dev
          kubectl get services -n dev
          POD=$(kubectl get pod -n dev \
            -l app=devsecops-app \
            -o jsonpath="{.items[0].metadata.name}")
          echo "Testing pod: $POD"
          kubectl exec $POD -n dev -- \
            curl -s http://localhost:5000/health
          echo "✅ DEV smoke test passed"

      - name: DEV deployment summary
        run: |
          echo "================================================"
          echo "✅ DEV DEPLOYMENT COMPLETE"
          echo "================================================"
          kubectl get all -n dev

# ============================================
# JOB 7 - DEPLOY TO STAGING
# ============================================
  deploy-staging:
    name: Deploy to STAGING
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install kind and create cluster
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name devsecops --wait 60s
          mkdir -p $HOME/.kube
          kind get kubeconfig --name devsecops > $HOME/.kube/config

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into kind
        run: |
          docker load < devsecops-app.tar
          kind load docker-image devsecops-app:latest --name devsecops
          echo "✅ Image loaded into cluster"

      - name: Create staging namespace
        run: |
          kubectl create namespace staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes secret to STAGING
        run: |
          kubectl apply -f k8s/secret.yaml -n staging
          echo "✅ Secrets applied to STAGING"

      - name: Deploy to STAGING
        run: |
          kubectl apply -f k8s/deployment.yaml -n staging
          kubectl apply -f k8s/service.yaml -n staging
          echo "✅ App deployed to STAGING"

      - name: Wait for STAGING deployment
        run: |
          kubectl rollout status deployment/devsecops-app \
            -n staging --timeout=120s
          echo "✅ STAGING deployment stable"

      - name: Smoke test STAGING
        run: |
          echo "🧪 Running STAGING smoke test..."
          kubectl get pods -n staging
          POD=$(kubectl get pod -n staging \
            -l app=devsecops-app \
            -o jsonpath="{.items[0].metadata.name}")
          echo "Testing pod: $POD"
          kubectl exec $POD -n staging -- \
            curl -s http://localhost:5000/health
          echo "✅ STAGING smoke test passed"

      - name: STAGING deployment summary
        run: |
          echo "================================================"
          echo "✅ STAGING DEPLOYMENT COMPLETE"
          echo "================================================"
          kubectl get all -n staging

# ============================================
# JOB 8 - MANUAL APPROVAL GATE
# ============================================
  approval-gate:
    name: Manual Approval for PROD
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: Awaiting Approval
        run: |
          echo "⏸️ Waiting for manual approval"
          echo "✅ DEV passed"
          echo "✅ STAGING passed"
          echo "👉 Approve in GitHub Actions to deploy to PROD"

# ============================================
# JOB 9 - DEPLOY TO PROD
# ============================================
  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: approval-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install kind and create cluster
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name devsecops --wait 60s
          mkdir -p $HOME/.kube
          kind get kubeconfig --name devsecops > $HOME/.kube/config

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into kind
        run: |
          docker load < devsecops-app.tar
          kind load docker-image devsecops-app:latest --name devsecops
          echo "✅ Image loaded into cluster"

      - name: Install Vault
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | \
            sudo gpg --dearmor -o \
            /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault -y

      - name: Start Vault and fetch secrets for PROD
        run: |
          vault server -dev \
            -dev-root-token-id="root-token" \
            -dev-listen-address="0.0.0.0:8200" &
          echo "⏳ Waiting for Vault to be ready..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8200/v1/sys/health \
              > /dev/null 2>&1; then
              echo "✅ Vault ready after $i attempts"
              break
            fi
            echo "Attempt $i - waiting..."
            sleep 2
          done
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=root-token
          vault kv put secret/devsecops-app \
            app-env="production" \
            app-key="devsecops-super-secret-key-2024"
          APP_ENV=$(vault kv get \
            -field=app-env secret/devsecops-app)
          APP_KEY=$(vault kv get \
            -field=app-key secret/devsecops-app)
          echo "✅ Secrets fetched from Vault successfully"
          echo "APP_ENV: $APP_ENV"

      - name: Create prod namespace
        run: |
          kubectl create namespace prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes secret to PROD
        run: |
          kubectl apply -f k8s/secret.yaml -n prod
          echo "✅ Secrets applied to PROD"

      - name: Deploy to PROD
        run: |
          kubectl apply -f k8s/deployment.yaml -n prod
          kubectl apply -f k8s/service.yaml -n prod
          echo "✅ App deployed to PROD"

      - name: Wait for PROD deployment
        run: |
          kubectl rollout status deployment/devsecops-app \
            -n prod --timeout=120s
          echo "✅ PROD deployment stable"

      - name: Final smoke test PROD
        run: |
          echo "🧪 Running PROD smoke test..."
          kubectl get pods -n prod
          POD=$(kubectl get pod -n prod \
            -l app=devsecops-app \
            -o jsonpath="{.items[0].metadata.name}")
          echo "Testing pod: $POD"
          kubectl exec $POD -n prod -- \
            curl -s http://localhost:5000/health
          echo "✅ PROD smoke test passed"

      - name: Save deployment logs
        run: |
          echo "===== DEV =====" > deployment-logs.txt
          kubectl get all -n dev >> deployment-logs.txt
          echo "===== STAGING =====" >> deployment-logs.txt
          kubectl get all -n staging >> deployment-logs.txt
          echo "===== PROD =====" >> deployment-logs.txt
          kubectl get all -n prod >> deployment-logs.txt
          echo "✅ All deployment logs saved"

      - name: Upload deployment logs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: deployment-logs.txt
        if: always()

      - name: Final deployment summary
        run: |
          echo "================================================"
          echo "🎉 FULL DEPLOYMENT COMPLETE"
          echo "================================================"
          echo "✅ DEV deployment passed"
          echo "✅ STAGING deployment passed"
          echo "✅ Manual approval gate passed"
          echo "✅ PROD deployment passed"
          echo "✅ Vault secrets management working"
          echo "✅ Kubernetes namespaces: dev, staging, prod"
          echo "✅ Terraform infrastructure provisioned"
          echo "✅ All security scans passed"
          echo "================================================"