name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:

  docker-build-push:

    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            navinya425/devsecops-app:latest
            navinya425/devsecops-app:${{ github.sha }}

  deploy-dev:

    needs: docker-build-push

    runs-on: self-hosted

    environment: dev

    steps:

      - name: Pull Latest Docker Image
        run: docker pull navinya425/devsecops-app:latest

      - name: Stop and Remove Old DEV Container
        shell: powershell
        run: |
          docker rm -f dev-app
        continue-on-error: true

      - name: Deploy DEV Container
        shell: powershell
        run: |
          docker run -d -p 5001:5000 `
          -e APP_ENV=development `
          --name dev-app `
          navinya425/devsecops-app:latest

  deploy-staging:

    needs: deploy-dev

    runs-on: self-hosted

    environment: staging

    steps:

      - name: Pull Latest Docker Image
        run: docker pull navinya425/devsecops-app:latest

      - name: Stop and Remove Old STAGING Container
        shell: powershell
        run: |
          docker rm -f staging-app
        continue-on-error: true

      - name: Deploy STAGING Container
        shell: powershell
        run: |
          docker run -d -p 5002:5000 `
          -e APP_ENV=staging `
          --name staging-app `
          navinya425/devsecops-app:latest

  deploy-production:

    needs: deploy-staging

    runs-on: self-hosted

    environment: production

    steps:

      - name: Pull Latest Docker Image
        run: docker pull navinya425/devsecops-app:latest

      - name: Stop and Remove Old PROD Container
        shell: powershell
        run: |
          docker rm -f prod-app
        continue-on-error: true

      - name: Deploy PROD Container
        shell: powershell
        run: |
          docker run -d -p 5003:5000 `
          -e APP_ENV=production `
          --name prod-app `
          navinya425/devsecops-app:latest