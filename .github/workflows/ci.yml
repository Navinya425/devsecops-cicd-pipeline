name: CI Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

# ============================================
# JOB 1 - SECRET SCANNING
# ============================================
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@5126fce0d9e7b6f56d1b3e1f22c2e84d7a13b09
        with:
          path: ./
          base: main
          extra_args: --only-verified

# ============================================
# JOB 2 - SAST SCANNING
# ============================================
  sast-scan:
    name: SAST Scan (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=app
            -Dsonar.python.version=3.11
            -Dsonar.qualitygate.wait=false

# ============================================
# JOB 3 - DEPENDENCY SCANNING
# ============================================
  dependency-scan:
    name: Dependency Scan (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run Snyk Dependency Scan
        uses: snyk/actions/python@b98d498629f1c5e001de76a94f30e6e6e0e6d5b
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=app/requirements.txt
        continue-on-error: true

      - name: Upload Snyk Report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: snyk-report
          path: snyk.sarif
        if: always()

# ============================================
# JOB 4 - CONTAINER SCANNING
# ============================================
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Docker image
        run: docker build -t devsecops-app:${{ github.sha }} .

      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Run Trivy and Save Report
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: sarif
          output: trivy-report.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy Report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: trivy-report
          path: trivy-report.sarif
        if: always()

# ============================================
# JOB 5 - POLICY GATE
# ============================================
  policy-gate:
    name: Policy Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-scan, dependency-scan, container-scan]
    steps:
      - name: All Security Scans Passed
        run: |
          echo "✅ Secret Scan passed"
          echo "✅ SAST Scan passed"
          echo "✅ Dependency Scan passed"
          echo "✅ Container Scan passed"
          echo "🚀 Policy Gate cleared - Ready for deployment"